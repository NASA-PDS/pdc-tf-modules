iam_roles:
  - iam_role_name: "pds-sbnumd-aoss-role"
    iam_role_description: "OpenSearch Serverless Authentication via Cognito for PDS SBNUMD"
    trust_relationship:
      Version: '2012-10-17'
      Statement:
        - Effect: "Allow"
          Principal:
            Federated: "cognito-identity.amazonaws.com"
          Action: "sts:AssumeRoleWithWebIdentity"
          Condition:
            StringEquals:
              "cognito-identity.amazonaws.com:aud": "us-west-2:9a3cff4d-a28c-4763-a5e3-844ddfab0764"
            ForAnyValue:StringLike:
              "cognito-identity.amazonaws.com:amr": "authenticated"
    custom_policy_arns:
      - "arn:aws:iam::REDACTED_ACCOUNT_DEV:policy/PDSOpenSearchServerlessAccessPolicy"
