iam_roles:
  - iam_role_name: "test_role_1"
    iam_role_description: "Test role 1"
    trust_relationship:
      Version: '2012-10-17'
      Statement:
        - Effect: "Allow"
          Principal:
            Service: "ecs.amazonaws.com"
          Action: "sts:AssumeRole"
    policies:
      - iam_policy_name: "TestPolicy1"
        iam_policy_document:
          Version: '2012-10-17'
          Statement:
            - Effect: "Allow"
              Action: "ec2:Describe*"
              Resource: "*"

  - iam_role_name: "test_role_2"
    iam_role_description: "Test role 2"
    trust_relationship:
      Version: '2012-10-17'
      Statement:
        - Effect: "Allow"
          Principal:
            Service: "lambda.amazonaws.com"
          Action: "sts:AssumeRole"
    policies:
      - iam_policy_name: "TestPolicy2"
        iam_policy_document:
          Version: '2012-10-17'
          Statement:
            - Effect: "Allow"
              Action:
                - "s3:GetObject"
                - "s3:PutObject"
              Resource: "arn:aws:s3:::test-bucket/*"
      - iam_policy_name: "TestPolicy3"
        iam_policy_document:
          Version: '2012-10-17'
          Statement:
            - Effect: "Allow"
              Action:
                - "aoss:*"
              Resource: "*"

