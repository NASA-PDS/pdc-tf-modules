  - task_family: "pds-prod-registry-sweepers"
    container_definitions:
      - name: "pds-en-prod-registry-sweepers-container"
        image: "456238491188.dkr.ecr.us-west-2.amazonaws.com/pds-registry-sweepers:latest"
        # cpu: 1024
        # memory: 2048
        # portMappings:
        #   - containerPort: 8080
        #     hostPort: 8080
        logConfiguration:
          logDriver: "awslogs"
          options:
            awslogs-region: "us-west-2"
            awslogs-group: "/ecs/pds-en-prod-registry-sweepers-task"
            awslogs-create-group: "true"
            awslogs-stream-prefix: "ecs"
        healthCheck:
          retries: 3
          command:
            - "CMD-SHELL"
            - "data || exit 1"
          timeout: 5
          interval: 60
          startPeriod: 300
        environment:
          - name: "MULTITENANCY_NODE_ID"
            value: "en"
          - name: "PROV_ENDPOINT" # This is the OpenSearch Serverless Collection Endpoint
            value: "https://b3rqys09xmx9i19yn64i.us-west-2.aoss.amazonaws.com"
    requires_compatibilities:
      - "FARGATE"
    network_mode: "awsvpc"
    runtimePlatform:
      operatingSystemFamily: "LINUX"
      cpuArchitecture: "X86_64"
    cpu: 1024
    memory: 2048
    execution_role_arn: "arn:aws:iam::456238491188:role/pds-registry-task-execution-role"
    task_role_arn: "arn:aws:iam::456238491188:role/pds-registry-sweeper-ecs-task-role"

